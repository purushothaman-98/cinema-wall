name: Apply upload feed patch

on:
  push:
    paths:
      - .github/patches/upload-feed-discovery.patch

permissions:
  contents: write

concurrency:
  group: cinema-wall-upload-feed-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply patch
        run: |
          git apply .github/patches/upload-feed-discovery.patch
          python -m py_compile scanner.py collectors.py data.py app.py youtube_analysis.py
          python -m json.tool scanner_config.json >/tmp/scanner_config.json
      - name: Commit real change
        run: |
          git config user.name "cinema-wall-maintainer"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/patches/upload-feed-discovery.patch .github/workflows/apply-upload-feed-patch.yml
          git add collectors.py scanner.py scanner_config.json .github/patches/upload-feed-discovery.patch .github/workflows/apply-upload-feed-patch.yml
          git commit -m "Use channel upload feeds for discovery"
          git push
