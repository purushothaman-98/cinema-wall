name: One-time top channel discovery

on:
  push:
    paths:
      - '.github/top-channel-discovery-trigger'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run forced top-channel discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scanner.py
      - name: Commit data and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/comments.csv data/live/video_snapshots.csv data/live/scan_metadata.json data/live/channel_evaluation.csv data/live/top_channel_coverage.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "data: fill top channel coverage"
          fi
          git rm -f .github/workflows/run-top-channel-discovery.yml .github/top-channel-discovery-trigger
          git commit -m "chore: remove one-time top channel runner"
          git push
